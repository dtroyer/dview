<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dView</title>
<link rel="stylesheet" href="style.css">
<script src="debug.js"></script>
<script type="module" src="app.js"></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="logo" aria-label="dView">dView</div>
  </header>

  <div class="cell controls" data-side="0">
    <button type="button" class="btn primary open" data-side="0">Open</button>
    <div class="filename" data-side="0">No image</div>
  </div>
  <div class="cell controls" data-side="1">
    <button type="button" class="btn primary open" data-side="1">Open</button>
    <div class="filename" data-side="1">No image</div>
  </div>

  <div class="cell frame" data-side="0"><div class="placeholder">Image 1</div></div>
  <div class="cell frame" data-side="1"><div class="placeholder">Image 2</div></div>

  <section class="cell panel meta" data-side="0" aria-label="Image 1 metadata"></section>
  <section class="cell panel meta" data-side="1" aria-label="Image 2 metadata"></section>
</div>

<dialog id="picker" class="panel picker" aria-labelledby="picker-title">
  <form method="dialog" class="picker-form">
    <div class="picker-head">
      <span id="picker-title" class="label">Open image</span>
      <span class="picker-path"></span>
    </div>
    <ul class="picker-list" role="listbox" aria-multiselectable="true" tabindex="0"></ul>
    <div class="picker-foot">
      <span class="picker-count"></span>
      <button type="button" class="btn secondary" value="cancel" data-action="cancel">Cancel</button>
      <button type="button" class="btn primary" data-action="open" disabled>Open</button>
    </div>
  </form>
</dialog>
</body>
</html>
